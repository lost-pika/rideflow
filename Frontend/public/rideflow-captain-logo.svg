<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 58" width="175" height="58">
  <!-- Icon Mark -->
  <g transform="translate(2, 6)">
    <rect width="42" height="42" rx="10" fill="#000000"/>
    <!-- Route flow stream -->
    <path d="M 12 32 C 12 21, 21 23, 23 18 C 25 13, 30 14, 30 11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Arrowhead at destination -->
    <path d="M 24 11 L 30 11 L 30 17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Origin pickup dot -->
    <circle cx="12" cy="32" r="2.5" fill="#10B981"/>
    <!-- Flow accent line -->
    <path d="M 15 26 C 17 20, 23 21, 25 15" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#000000">Ride</tspan><tspan fill="#000000">Flow</tspan>
  </text>
  <!-- Captain Badge -->
  <g transform="translate(52, 34)">
    <rect width="70" height="18" rx="4" fill="#10B981"/>
    <text x="35" y="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1.5">CAPTAIN</text>
  </g>
</svg>
